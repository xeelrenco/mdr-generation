# Copia questo file in settings.toml e compila i valori locali.

[project]
code = "7350"
start_date = ""  # vuoto = oggi per PLANNED FIRST ISSUE

[database]
motherduck_db = "my_db"
motherduck_token = ""

[scope]
sow_dir = "input/SoW"
max_pdf_mb = 32

[scope.pass1]
llm_model = "gpt-5.5"
chunk_enabled = true
chunk_pages = 10
chunk_overlap = 1
chunk_repass_enabled = true
chunk_repass_min_chars = 200

[scope.pass2]
enabled = true
llm_model = "claude-sonnet-4-6"  # verifica catalogo indipendente dal pass 1
arbiter_llm_model = "gemini-3.1-pro-preview"  # solo sui disaccordi/unknown tra pass 1 e pass 2
batch_size = 30
workers = 4
chunk_enabled = true
chunk_pages = 10
chunk_overlap = 2
job_max_attempts = 3  # ritenta un job se il JSON e' illeggibile o mancano coppie assegnate

[providers.openai]
api_key = ""
model = "gpt-5.5"

[providers.claude]
api_key = ""
model = "claude-haiku-4-5"
max_tokens = 16384

[providers.vertex]
credentials_path = ""  # es. credentials/project-xxxx.json (relativo alla root progetto)
project_id = ""
location = "europe-west1"
gemini_model = "gemini-2.5-pro"

[schedule]
enabled = true  # controlla durata timeline, MANHOURS (col. X) e PLANNED FIRST ISSUE (col. AC)
debug_columns = false  # se true: colonne DBG_* sull'MDR (AJ+, riga 12 = project start)

[parallel]
llm_workers = 15

[title_enrichment]
enabled = true
apply_suffixes = true  # Step 10: attacca i nomi SoW alle copie dello Step 9 (non cambia N)
max_elements_per_doc = 15
min_confidence = "medium"
llm_model = ""  # vuoto = usa scope.pass1.llm_model
examples_path = "input/title_enrichment_examples.json"
max_examples = 24
generic_filter = true  # scarta suffissi generici (livello impianto/unita) se ce ne sono piu' di uno
generic_patterns = []  # regex extra opzionali; le cifre/tag salvano sempre il titolo

[sow_mandatory]
# Canale indipendente dallo scope consensus: deliverable che lo SoW obbliga
# esplicitamente a consegnare. Solo audit + foglio QA, non blocca la pipeline.
enabled = true
min_match_score = 0.6  # copertura minima dei token del nome documento sul titolo RACI
fail_on_missing = false  # true = solo warning piu' marcato in QA, mai exit 1
max_attempts = 4  # questo pass gira a fine pipeline: rate limit e' normale
retry_backoff_seconds = 60  # attesa base, cresce a ogni tentativo (60/120/180)
llm_model = ""  # vuoto = usa scope.pass1.llm_model

# Opzionale: override tariffe stima costi LLM (USD per 1M token, standard short-context)
